[project]
name = "money-tracker"
version = "0.1.0"
description = "Self-hosted Quicken replacement — local PostgreSQL, daily account sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.3",
    "django>=6.0",
    "django-environ>=0.12.0",
    "gunicorn>=20.1",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.0",
    "whitenoise>=6.11.0",
    "openai>=1.40.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
