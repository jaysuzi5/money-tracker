{% extends 'base.html' %}
{% block title %}Add property{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="mt-page-header"><h1>Add property</h1></div>
    <div class="card">
      <div class="card-body">
        <form method="post">{% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input name="name" class="form-control" placeholder="e.g. 148 Blackstone, 2022 Polestar 2" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Current value</label>
            <input name="value" class="form-control" placeholder="0.00" required>
          </div>
          <div class="mb-3">
            <label class="form-label">As of date</label>
            <input type="date" name="date" class="form-control" value="{{ today|date:'Y-m-d' }}">
          </div>
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Add property</button>
            <a href="{% url 'tracker:dashboard' %}" class="btn btn-light">Cancel</a>
          </div>
          <p class="form-text mt-3">Tracks home/vehicle value toward Net Worth. After creating, click it in the sidebar to log value increases/decreases over time.</p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
