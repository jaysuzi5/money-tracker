{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Money Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'css/site.css' %}" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; }
    .brand { color: #fff; text-align: center; margin-bottom: 1.5rem; font-weight: 700; font-size: 1.5rem; }
    .brand .bi { color: var(--mt-accent); }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand"><i class="bi bi-wallet2"></i> Money Tracker</div>
    <div class="card">
      <div class="card-body p-4">
        <h5 class="mb-3 fw-bold">Sign in</h5>
        {% if form.errors %}<div class="alert alert-danger py-2">Invalid username or password.</div>{% endif %}
        <form method="post">{% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
